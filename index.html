<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#FFD23F;--ink:#1B1F3B;--coral:#FF5D73;--mint:#3DDC97;--white:#FFFDF5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px}
h1{margin:0;font-size:2rem;font-weight:900;letter-spacing:-1px}
#status{font-size:.75rem;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--ink);color:var(--white)}
#status.off{background:var(--coral)}
main{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;align-items:center}
#stage{position:relative;width:min(86vw,360px);aspect-ratio:1;margin-top:10px}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 0 var(--ink))}
#pin{position:absolute;left:50%;top:-10px;width:0;height:0;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--ink);z-index:2}
#go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:var(--white);color:var(--ink);font:900 1.1rem "Trebuchet MS",sans-serif;z-index:3}
#go:active{transform:translate(-50%,-50%) scale(.94)}
#result{margin:26px 0 8px;min-height:3.6rem;font-size:2rem;font-weight:900;text-align:center;line-height:1.1}
#result.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
form{display:flex;gap:8px;width:100%}
input{flex:1;min-width:0;font:700 1rem "Trebuchet MS",sans-serif;padding:13px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--white);color:var(--ink)}
button.add{font:900 1rem "Trebuchet MS",sans-serif;padding:0 20px;border:3px solid var(--ink);border-radius:14px;background:var(--mint);color:var(--ink)}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;width:100%}
.chip{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border:3px solid var(--ink);border-radius:99px;background:var(--white);font-weight:700}
.chip button{width:24px;height:24px;border:0;border-radius:50%;background:var(--ink);color:var(--white);font-weight:900;line-height:1}
footer{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;font-size:.78rem;font-weight:700}
#install{display:none;font:900 .8rem "Trebuchet MS",sans-serif;padding:8px 14px;border:3px solid var(--ink);border-radius:99px;background:var(--coral);color:var(--ink)}
@media(prefers-reduced-motion:reduce){#result.pop{animation:none}}
</style>
</head>
<body>
<header><h1>Ruleta</h1><span id="status">en línea</span></header>
<main>
  <div id="stage"><div id="pin"></div><canvas id="wheel" width="720" height="720"></canvas><button id="go">GIRAR</button></div>
  <div id="result">¿Qué hacemos?</div>
  <form id="f"><input id="txt" placeholder="Agrega una opción" maxlength="22" autocomplete="off"><button class="add">Añadir</button></form>
  <div id="chips"></div>
</main>
<footer><span>Versión <b id="ver">1.0</b></span><button id="install">Instalar app</button></footer>

<script>
const VERSION="1.0";
document.getElementById("ver").textContent=VERSION;
const COLORS=["#FF5D73","#3DDC97","#1B1F3B","#FFFDF5","#6C5CE7","#FF9F43"];
const TEXT_ON=["#1B1F3B","#1B1F3B","#FFFDF5","#1B1F3B","#FFFDF5","#1B1F3B"];
let opts=[];
try{opts=JSON.parse(localStorage.getItem("opts"))||[]}catch(e){}
if(!opts.length)opts=["Pizza","Tacos","Sushi","Hamburguesa","Pasta"];
let rot=0,spinning=false;
const cv=document.getElementById("wheel"),ctx=cv.getContext("2d");
const result=document.getElementById("result");

function save(){try{localStorage.setItem("opts",JSON.stringify(opts))}catch(e){}}
function draw(){
  const S=cv.width,c=S/2,n=opts.length,a=2*Math.PI/n;
  ctx.clearRect(0,0,S,S);
  for(let i=0;i<n;i++){
    const s=rot+i*a;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,c-8,s,s+a);ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
    ctx.lineWidth=6;ctx.strokeStyle="#1B1F3B";ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate(s+a/2);
    ctx.fillStyle=TEXT_ON[i%COLORS.length];ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.font="900 "+(n>8?30:38)+"px Trebuchet MS, sans-serif";
    ctx.fillText(opts[i],c-50,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(c,c,c-8,0,2*Math.PI);ctx.lineWidth=12;ctx.strokeStyle="#1B1F3B";ctx.stroke();
}
function chips(){
  const box=document.getElementById("chips");box.innerHTML="";
  opts.forEach((o,i)=>{
    const d=document.createElement("div");d.className="chip";
    const t=document.createElement("span");t.textContent=o;
    const b=document.createElement("button");b.textContent="×";b.setAttribute("aria-label","Quitar "+o);
    b.onclick=()=>{if(opts.length>2&&!spinning){opts.splice(i,1);save();render()}};
    d.append(t,b);box.append(d);
  });
}
function render(){draw();chips()}
function spin(){
  if(spinning)return;spinning=true;
  result.textContent="…";result.classList.remove("pop");
  const start=rot,total=Math.PI*2*(5+Math.random()*3)+Math.random()*Math.PI*2,dur=4200,t0=performance.now();
  (function f(now){
    const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
    rot=start+total*e;draw();
    if(p<1)return requestAnimationFrame(f);
    spinning=false;
    const a=2*Math.PI/opts.length,ang=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    result.textContent=opts[Math.floor(ang/a)];
    void result.offsetWidth;result.classList.add("pop");
    if(navigator.vibrate)navigator.vibrate([60,40,120]);
  })(t0);
}
document.getElementById("go").onclick=spin;
document.getElementById("f").onsubmit=e=>{
  e.preventDefault();const i=document.getElementById("txt"),v=i.value.trim();
  if(v&&opts.length<12&&!spinning){opts.push(v);save();render()}
  i.value="";
};
render();

// Estado de conexión
const st=document.getElementById("status");
function net(){st.textContent=navigator.onLine?"en línea":"sin conexión";st.className=navigator.onLine?"":"off"}
addEventListener("online",net);addEventListener("offline",net);net();

// Botón instalar
let dp;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;document.getElementById("install").style.display="block"});
document.getElementById("install").onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;document.getElementById("install").style.display="none"}};

// Service worker + recarga automática al actualizar
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)location.reload();had=true});
}
</script>
</body>
</html>
