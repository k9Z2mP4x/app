<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avisos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3DDC97">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#3DDC97;--ink:#1B1F3B;--coral:#FF5D73;--white:#FFFDF5;--sun:#FFD23F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center}
main{flex:1;width:100%;max-width:420px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
#bell{width:150px;height:150px;border-radius:50%;background:var(--white);border:5px solid var(--ink);box-shadow:0 8px 0 var(--ink);display:grid;place-items:center;transition:background .3s}
#bell.on{background:var(--sun);animation:ring 1.2s ease 1}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
h1{margin:6px 0 0;font-size:2.3rem;font-weight:900;letter-spacing:-1px}
#msg{margin:0;font-size:1.05rem;font-weight:700;max-width:30ch;line-height:1.35}
#btn{width:100%;font:900 1.15rem "Trebuchet MS",sans-serif;padding:17px;border:4px solid var(--ink);border-radius:18px;background:var(--coral);color:var(--ink);box-shadow:0 6px 0 var(--ink)}
#btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
#btn.off{background:var(--white)}
#btn:disabled{opacity:.5}
#hint{min-height:2.6rem;font-size:.85rem;font-weight:700;background:var(--ink);color:var(--white);padding:10px 14px;border-radius:14px;display:none}
footer{padding:10px 0 14px;font-size:.78rem;font-weight:700}
@media(prefers-reduced-motion:reduce){#bell.on{animation:none}}
</style>
</head>
<body>
<main>
  <div id="bell"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#1B1F3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
  <h1>Avisos</h1>
  <p id="msg">Cargando…</p>
  <button id="btn" disabled>Un momento…</button>
  <div id="hint"></div>
</main>
<footer>Versión <b id="ver">2.0</b></footer>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
const base = location.pathname.replace(/[^/]*$/, "");
const $ = id => document.getElementById(id);
const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  await OneSignal.init({
    appId: "28970e60-0248-45dc-a58e-88f6cd73173b",
    serviceWorkerPath: base + "service-worker.js",
    serviceWorkerParam: { scope: base },
    notifyButton: { enable: false }
  });

  function paint() {
    const opted = OneSignal.User.PushSubscription.optedIn;
    const denied = Notification.permission === "denied";
    $("bell").className = opted ? "on" : "";
    $("btn").disabled = denied;
    $("btn").className = opted ? "off" : "";
    $("btn").textContent = opted ? "Desactivar avisos" : "Activar notificaciones";
    $("msg").textContent = opted ? "Listo. Te llegarán los avisos aunque la app esté cerrada." : "Activa las notificaciones para recibir los avisos.";
    const h = $("hint");
    if (denied) { h.style.display = "block"; h.textContent = "Bloqueaste las notificaciones. Actívalas en los ajustes del navegador para este sitio."; }
    else if (isiOS && !standalone) { h.style.display = "block"; h.textContent = "En iPhone: primero toca Compartir → Agregar a pantalla de inicio y abre la app desde ahí."; }
    else h.style.display = "none";
  }

  $("btn").onclick = async () => {
    $("btn").disabled = true;
    if (OneSignal.User.PushSubscription.optedIn) {
      await OneSignal.User.PushSubscription.optOut();
    } else {
      await OneSignal.Notifications.requestPermission();
      if (Notification.permission === "granted") await OneSignal.User.PushSubscription.optIn();
    }
    $("btn").disabled = false;
    paint();
  };

  OneSignal.User.PushSubscription.addEventListener("change", paint);
  paint();
});

// Recarga automática cuando hay versión nueva
if ("serviceWorker" in navigator) {
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) location.reload(); had = true; });
}
</script>
</body>
</html>
